name: CI/CD

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install yarn packages
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Prettier frontend
        run: |
          cd frontend
          yarn prettier . --check

      - name: Test frontend
        run: |
          cd frontend
          yarn test --ci --watchAll=false --runInBand

      - name: Type check frontend
        run: yarn tsc --noEmit
        working-directory: ./frontend


  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/test-requirements.txt

      - name: Black backend
        run: |
          cd backend
          black . --check

      - name: Test backend
        run: |
          cd backend
          pytest .


  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install virtualenv
        run: pip install virtualenv

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.1.7
          terraform_wrapper: false

      # TODO: Re-use built artifacts for staging+prod?
      - name: Build
        run: make

      - name: Start local environment
        run: make local-env

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/Cypress
            node_modules
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - run: npx cypress install
        working-directory: ./frontend
        env:
          NODE_OPTIONS: ''

      - name: Cypress run dev
        uses: cypress-io/github-action@v7
        with:
          working-directory: ./frontend
          record: false
          install: false
        env:
          NODE_OPTIONS: ''


  deploy:
    runs-on: ubuntu-24.04

    needs:
      - backend
      - frontend
      - integration

    # Leave disabled until the CI principal can manage the new AWS protections.
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOYMENTS_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set terraform version
        run: echo "TERRAFORM_VERSION=$(cat ./.terraform-version)" >> $GITHUB_ENV
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install virtualenv
        run: pip install virtualenv

      - name: Build
        run: make

      - name: Deploy staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-1
          AUTO_APPROVE_TF: true
        run: make target=staging deploy


      - name: Cypress run staging
        uses: cypress-io/github-action@v7
        with:
          config: baseUrl=https://stagingwww.nafnaval.is
          spec: cypress/smoke/protected-signup.spec.js
          working-directory: ./frontend
          record: false
        env:
          NODE_OPTIONS: ''

      - name: Deploy prod
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-1
          AUTO_APPROVE_TF: true
        run: make target=prod deploy
